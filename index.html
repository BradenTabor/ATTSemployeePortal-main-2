<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      Pinch-zoom stays enabled (WCAG 1.4.4). iOS focus-zoom is prevented by the
      16px minimum input font-size in src/index.css and double-tap zoom by
      `touch-action: manipulation` on html/body, so the viewport no longer needs
      maximum-scale / user-scalable=no. viewport-fit=cover lets the app paint
      under the notch / home indicator (safe-area utilities handle the insets).
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#040605" />
    <meta name="description" content="All Terrain Tree Service Employee Portal" />
    <!--
      CANOPY type system (self-hosted in /public/fonts, declared in src/index.css)
        Fraunces            — display serif (variable optical size, italic for hero words)
        Bricolage Grotesque — UI sans (variable optical size)
        Martian Mono        — instrument labels, eyebrows, tabular data
      Preload the two faces that paint above the fold; italic serif and mono load on demand.
      fetchpriority=low keeps them from competing with the stylesheet and app
      chunks on a slow link — text paints in the fallback face (font-display:
      swap) and upgrades, rather than the whole page waiting.
    -->
    <link rel="preload" as="font" type="font/woff2" fetchpriority="low" href="/fonts/bricolage-grotesque-latin-wght-normal.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" fetchpriority="low" href="/fonts/fraunces-latin-wght-normal.woff2" crossorigin />
    <!-- Supabase preconnect: injected at build from VITE_SUPABASE_URL (project-specific origin) -->
    
    <!-- iOS PWA Meta Tags (REQUIRED FOR PUSH NOTIFICATIONS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ATTS Portal" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <title>ATTS Employee Portal</title>
    <!--
      Pre-hydration splash. The app is a SPA, so nothing paints until ~230 KB of
      JS arrives — on a slow cell link that is 2–3 s of black screen. This inline,
      CSS-only shell (mirrors components/LoadingScreen) paints with the HTML and
      is replaced wholesale by React's first render.
    -->
    <style>
      html, body { margin: 0; background: #040605; }
      /* Shared by the HTML splash and React LoadingScreen: no font or JS dependency. */
      .boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        box-sizing: border-box; overflow: auto; padding: 32px 24px;
        background: #040605; color: #F4F7F2;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .boot-content { position: relative; width: min(100%, 360px); text-align: center; }
      .boot-content::before {
        content: ""; position: absolute; inset: -80px -24px; pointer-events: none;
        background: radial-gradient(ellipse, rgba(61,220,132,0.09), transparent 70%);
      }
      .boot-tile {
        position: relative; display: grid; place-items: center; width: 64px; height: 64px; margin: 0 auto;
        box-sizing: border-box; overflow: hidden; border-radius: 22px 8px 22px 8px; border: 1px solid rgba(244,247,242,0.4);
        background: linear-gradient(160deg, #FFFFFF 0%, #E4EAE1 100%);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 24px -12px rgba(61,220,132,0.45);
        color: #040605; font-weight: 800; font-size: 17px; letter-spacing: 0.08em;
      }
      .boot-logo { display: block; width: 100%; height: 100%; object-fit: contain; object-position: 50% 52%; transform: scale(1.9); }
      .boot-name { position: relative; margin: 24px 0 0; font-size: clamp(28px, 4vw, 36px); font-weight: 400; line-height: 1.2; letter-spacing: -0.035em; }
      .boot-sub { position: relative; margin: 8px 0 0; font-size: 12px; line-height: 1.5; letter-spacing: 0.04em; color: #ABC0B3; }
      .boot-loading { position: relative; margin: 32px auto 0; max-width: 256px; }
      .boot-status { margin: 0 0 14px; font-size: 14px; font-weight: 500; line-height: 1.5; color: #E4EAE1; }
      .boot-track { position: relative; height: 4px; border-radius: 999px; overflow: hidden; background: #24372D; }
      .boot-track::after {
        content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit;
        background: #8DF5A8; animation: boot-sweep 1.5s ease-in-out infinite alternate;
      }
      .boot-help { min-height: 40px; margin: 16px 0 0; font-size: 12px; line-height: 1.6; color: #ABC0B3; }
      .boot-help span { visibility: hidden; animation: boot-reveal 0s 12s forwards; }
      @keyframes boot-sweep { from { transform: translateX(0); } to { transform: translateX(150%); } }
      @keyframes boot-reveal { to { visibility: visible; } }
      @media (prefers-reduced-motion: reduce) { .boot-track::after { animation: none; left: 30%; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div class="boot-content">
          <div class="boot-tile">
            <img class="boot-logo" src="/src/assets/atts-logo.webp" alt="ATTS" width="64" height="64" fetchpriority="high" />
          </div>
          <p class="boot-name">All Terrain</p>
          <p class="boot-sub">Tree Service · Employee Portal</p>
          <div class="boot-loading">
            <p class="boot-status" role="status">Opening your portal…</p>
            <div class="boot-track" aria-hidden="true"></div>
            <p class="boot-help"><span>Taking longer than usual.<br />If this continues, check your connection.</span></p>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
