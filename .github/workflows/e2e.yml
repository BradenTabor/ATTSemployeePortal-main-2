# E2E tests with Playwright – sharded across parallel jobs for speed.
# Merge job produces a single HTML report from all shards.
#
# Required GitHub Secrets (Settings > Secrets and variables > Actions):
#   - E2E_SUPABASE_URL: Dedicated NONPRODUCTION Supabase project URL
#   - E2E_SUPABASE_ANON_KEY: Test project anonymous key
#   - E2E_SUPABASE_SERVICE_ROLE_KEY: Test project service role key for seeding

name: E2E

on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CI: true
  PLAYWRIGHT_BASE_URL: http://localhost:5183
  # Supabase environment variables (from GitHub secrets)
  VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}

jobs:
  e2e:
    name: E2E (shard ${{ matrix.shard }}/${{ matrix.shards }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
        shards: [3]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate nonproduction test configuration
        run: |
          test -n "$VITE_SUPABASE_URL" && test -n "$VITE_SUPABASE_ANON_KEY" && test -n "$SUPABASE_SERVICE_ROLE_KEY" || {
            echo "::error::Configure E2E_SUPABASE_URL, E2E_SUPABASE_ANON_KEY, and E2E_SUPABASE_SERVICE_ROLE_KEY for a dedicated test project."
            exit 1
          }
          npx tsx -e 'import { assertSafeE2ETarget } from "./tests/setup/e2eEnv"; assertSafeE2ETarget("GitHub E2E");'

      # Chromium only for faster CI; use `npx playwright install --with-deps` for all browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Generate test fixtures for photo upload tests
      - name: Generate test fixtures
        run: npm run test:fixtures

      - name: Seed test users
        run: npm run test:setup

      - name: Run Playwright tests (shard ${{ matrix.shard }}/${{ matrix.shards }})
        run: >
          npx playwright test
          --project=chromium
          --shard=${{ matrix.shard }}/${{ matrix.shards }}
          --reporter=blob

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  merge-reports:
    name: Merge reports
    runs-on: ubuntu-latest
    needs: e2e
    if: always() && !cancelled() && needs.e2e.result != 'cancelled'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (for merge-reports)
        run: npx playwright install --with-deps chromium

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: blob-reports
          pattern: blob-*
          merge-multiple: true

      - name: Merge Playwright reports
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: tests/e2e-report
        run: |
          npx playwright merge-reports blob-reports --reporter=html

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e-report/
          retention-days: 7

  fail-if-failed:
    name: Fail if any shard failed
    runs-on: ubuntu-latest
    needs: [e2e, merge-reports]
    if: always() && !cancelled()
    steps:
      - name: Check e2e result
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "E2E shards did not all succeed: ${{ needs.e2e.result }}"
            exit 1
          fi
      - name: Check merge result
        run: |
          if [ "${{ needs.merge-reports.result }}" != "success" ]; then
            echo "Merge reports failed: ${{ needs.merge-reports.result }}"
            exit 1
          fi
